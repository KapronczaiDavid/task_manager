spring.application.name=task-manager-backend
server.port=8080

# A DB_URL / DB_USERNAME / DB_PASSWORD környezeti változókkal felülírható.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Budapest&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
